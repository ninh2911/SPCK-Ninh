<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    

    <div class="container vh-100 d-flex justify-content-center align-items-center px-3">

        <div class="card shadow p-4 w-100" style="max-width:400px;">

            <h2 class="text-center mb-4">Đăng nhập</h2>

            <input type="text" class="form-control mb-3" id="username" placeholder="Tên đăng nhập">

            <input type="password" class="form-control mb-3" id="password" placeholder="Mật khẩu">

            <button class="btn btn-primary w-100" onclick="login()">
                Đăng nhập
            </button>

            <p class="text-center mt-3">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký</a>
            </p>

        </div>

    </div>

    <script>

        function login() {

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            let user = localStorage.getItem(username);

            if (user == null) {
                alert("Không tồn tại tài khoản!");
                return;
            }

            user = JSON.parse(user);

            if (user.password == password) {

                localStorage.setItem("loginUser", username);

                alert("Đăng nhập thành công!");

                window.location = "main.html";

            } else {

                alert("Sai mật khẩu!");

            }

        }

    </script>

</body>

</html>
