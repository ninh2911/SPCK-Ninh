<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container vh-100 d-flex justify-content-center align-items-center px-3">

        <div class="card shadow p-4 w-100" style="max-width:400px;">

            <h2 class="text-center mb-4">Đăng ký</h2>

            <input id="username" class="form-control mb-3" placeholder="Tên đăng nhập">

            <input id="password" type="password" class="form-control mb-3" placeholder="Mật khẩu">

            <input id="confirm" type="password" class="form-control mb-3" placeholder="Nhập lại mật khẩu">

            <button class="btn btn-success w-100" onclick="register()">

                Đăng ký

            </button>

            <p class="text-center mt-3">

                Đã có tài khoản?

                <a href="index.html">Đăng nhập</a>

            </p>

        </div>

    </div>

    <script>

        function register() {

            let username = document.getElementById("username").value;

            let password = document.getElementById("password").value;

            let confirm = document.getElementById("confirm").value;

            if (username == "" || password == "") {

                alert("Không được để trống!");

                return;

            }

            if (password != confirm) {

                alert("Mật khẩu không khớp!");

                return;

            }

            if (localStorage.getItem(username) != null) {

                alert("Tên đăng nhập đã tồn tại!");

                return;

            }

            let user = {

                username: username,

                password: password

            };

            localStorage.setItem(username, JSON.stringify(user));

            alert("Đăng ký thành công!");

            window.location = "index.html";

        }

    </script>

</body>

</html>
